<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keranjang — Uncle Jo</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>

<body class="page-wrapper">

  <!-- Navbar -->
  <header class="navbar">
    <div class="navbar-inner">
      <a href="menu.html" class="navbar-brand" style="gap:var(--space-2);font-size:0.9rem;">
        <i data-lucide="arrow-left" style="width:18px;height:18px;color:var(--text-secondary);"></i>
        Kembali ke Menu
      </a>
      <div class="navbar-brand" style="display:flex;align-items:center;gap:6px;">
        <i data-lucide="shopping-cart" style="width:17px;height:17px;color:var(--coffee-500);"></i>
        Keranjang
      </div>
    </div>
  </header>

  <!-- Konten -->
  <main class="cart-body container">

    <!-- Daftar Item -->
    <div class="card mt-5" id="cartCard">
      <div class="card-header" style="display:flex;align-items:center;gap:8px;">
        <i data-lucide="shopping-cart" style="width:17px;height:17px;color:var(--coffee-500);"></i>
        Pesanan Saya
      </div>
      <div class="card-body" id="cartItemsContainer">
        <div style="text-align:center;padding:var(--space-8) 0;color:var(--text-muted);">
          <i data-lucide="loader-circle"
            style="width:32px;height:32px;margin:0 auto;display:block;margin-bottom:8px;"></i>
          Memuat keranjang...
        </div>
      </div>
    </div>

    <!-- Summary & Checkout -->
    <div id="summarySection" style="display:none;">
      <div class="summary-box mt-4">
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="subtotalVal">Rp 0</span>
        </div>
        <div class="summary-row summary-total">
          <span>Total Pembayaran</span>
          <span id="totalVal">Rp 0</span>
        </div>
      </div>

      <div style="margin-top:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);">
        <a href="checkout.html" class="btn btn-primary btn-full btn-lg">
          <i data-lucide="receipt" style="width:18px;height:18px;"></i>
          Lanjut ke Checkout
        </a>
        <button onclick="clearCart()" class="btn btn-ghost btn-full" style="font-size:0.82rem;color:#dc2626;font-weight:600;">
          <i data-lucide="trash-2" style="width:15px;height:15px;"></i>
          Kosongkan Keranjang
        </button>
      </div>
    </div>

  </main>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
</body>

</html>
