<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu — Uncle Jo</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>

<body class="page-wrapper">

  <!-- Navbar -->
  <header class="navbar" style="border-bottom: none; box-shadow: none; background: transparent;">
    <div class="navbar-inner" style="display: flex; justify-content: space-between; align-items: flex-start; padding: var(--space-6) var(--space-5) var(--space-2) var(--space-5);">
      <div>
        <h1 style="font-family: 'Times New Roman', Times, Baskerville, Georgia, serif; font-size: 2.2rem; font-weight: 700; color: var(--text-primary); line-height: 1.15; margin-bottom: 6px;">Menu Kami</h1>
        <div style="font-size: 0.88rem; color: var(--text-secondary); display: flex; align-items: center; gap: 4px; font-weight: 500;">
          <i data-lucide="map-pin" style="width: 14px; height: 14px; color: var(--coffee-500);"></i>
          <span id="mejaText">Meja —</span>
        </div>
      </div>
      <div>
        <a href="cart.html" class="btn btn-primary" style="background: var(--coffee-900); border-color: var(--coffee-900); border-radius: 50px; padding: 10px 22px; font-size: 0.88rem; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; color: white; text-decoration: none; box-shadow: var(--shadow-sm);">
          <i data-lucide="shopping-cart" style="width: 16px; height: 16px;"></i>
          Keranjang
          <span class="cart-count" id="cartCount" style="position: static; display: inline-flex; background: var(--primary); color: white; font-size: 0.72rem; font-weight: 700; min-width: 18px; height: 18px; border-radius: 50%; align-items: center; justify-content: center; border: none; padding: 0 4px; margin-left: 2px;">0</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Filter Kategori -->
  <div style="background: transparent;">
    <div class="category-scroll" id="categoryScroll">
      <!-- Dimuat secara dinamis -->
    </div>
  </div>

  <!-- Konten Menu -->
  <main class="content">
    <div class="menu-list" id="menuList">
      <div class="empty-state">
        <div class="empty-state-icon"><i data-lucide="loader-circle" style="width:40px;height:40px;"
            id="loadingIcon"></i></div>
        <p>Memuat menu...</p>
      </div>
    </div>
  </main>

  <!-- Modal Detail Menu -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-box" style="position:relative;">
      <img id="modalImg" class="modal-img" src="" alt="">
      <button class="modal-close-btn" onclick="closeModal()">
        <i data-lucide="x" style="width:16px;height:16px;"></i>
      </button>
      <div class="modal-body">
        <span id="modalKategori" class="badge"
          style="background:var(--surface-beige);color:var(--coffee-600);border-color:var(--border);margin-bottom:var(--space-3);"></span>
        <div style="font-size:1.3rem;font-weight:800;color:var(--text-primary);margin-bottom:4px;" id="modalNama">-
        </div>
        <div style="font-size:1.1rem;font-weight:700;color:var(--coffee-600);margin-bottom:var(--space-4);"
          id="modalHarga">-</div>

        <!-- Deskripsi Menu -->
        <div id="modalDeskripsi"
          style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:var(--space-5);line-height:1.5;">-</div>

        <!-- Varian Section -->
        <div id="variantSection" style="margin-bottom:var(--space-5);display:none;">
          <div
            style="font-size:0.75rem;font-weight:700;color:var(--text-secondary);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px;">
            Pilih Varian</div>
          <div style="display:flex;gap:var(--space-2);">
            <label
              style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:var(--radius-md);border:1.5px solid var(--border);cursor:pointer;font-weight:600;font-size:0.85rem;transition:var(--transition);"
              class="variant-opt" id="optHot" onclick="selectVariant('Hot')">
              <input type="radio" name="variantOpt" value="Hot" style="display:none;">
              <i data-lucide="flame" style="width:14px;height:14px;color:#dc2626;"></i> Hot
            </label>
            <label
              style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:var(--radius-md);border:1.5px solid var(--border);cursor:pointer;font-weight:600;font-size:0.85rem;transition:var(--transition);"
              class="variant-opt" id="optIce" onclick="selectVariant('Ice')">
              <input type="radio" name="variantOpt" value="Ice" style="display:none;">
              <i data-lucide="snowflake" style="width:14px;height:14px;color:#2563eb;"></i> Ice
            </label>
          </div>
        </div>

        <button class="btn btn-primary btn-full btn-lg" id="btnAddToCart">
          <i data-lucide="plus" style="width:18px;height:18px;"></i>
          Tambah ke Keranjang
        </button>
      </div>
    </div>
  </div>

  <script src="js/menu.js"></script>
</body>

</html>
