<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin — Uncle Joe</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    /* Styling khusus override untuk mencocokkan mockup premium */
    body.admin-login-body {
      background: radial-gradient(circle at top, #4e3421 0%, #170d06 100%);
      font-family: 'Poppins', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-6) var(--space-5);
      color: #ffffff;
      overflow-y: auto;
    }

    .brand-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: var(--space-6);
    }

    .logo-frame {
      width: 104px;
      height: 104px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: var(--space-4);
      padding: var(--space-2);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .logo-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .brand-title {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
      text-align: center;
      line-height: 1.1;
    }

    .brand-subtitle {
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #d4a97a;
      text-transform: uppercase;
      text-align: center;
    }

    .login-card-custom {
      background: #faf6f0;
      border-radius: var(--radius-xl);
      width: 100%;
      max-width: 400px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .card-header-custom {
      padding: var(--space-6) var(--space-6) var(--space-4) var(--space-6);
      border-bottom: 1px solid #ebdcd0;
    }

    .card-title-custom {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: #2c1a0e;
      margin-bottom: 4px;
    }

    .card-subtitle-custom {
      font-size: 0.85rem;
      color: #7a6350;
    }

    .card-body-custom {
      padding: var(--space-6);
    }

    .form-group-custom {
      margin-bottom: var(--space-5);
    }

    .form-label-custom {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: #2c1a0e;
      margin-bottom: var(--space-2);
    }

    .input-wrapper-custom {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon-custom {
      position: absolute;
      left: 18px;
      color: #7a6350;
      pointer-events: none;
    }

    .form-control-custom {
      width: 100%;
      padding: 13px var(--space-5) 13px 46px;
      background: #fbf8f5;
      border: 1.5px solid #ebdcd0;
      border-radius: 20px;
      font-size: 0.9rem;
      font-family: inherit;
      color: #2c1a0e;
      transition: all 0.2s ease;
    }

    .form-control-custom:focus {
      outline: none;
      border-color: #7a4f2a;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(122, 79, 42, 0.1);
    }

    .form-control-custom::placeholder {
      color: #a48e7e;
    }

    .forgot-pw-link {
      display: block;
      text-align: right;
      font-size: 0.78rem;
      font-weight: 700;
      color: #7a4f2a;
      text-decoration: none;
      margin-top: -6px;
      margin-bottom: var(--space-5);
      transition: color 0.2s ease;
    }

    .forgot-pw-link:hover {
      color: #2c1a0e;
    }

    .pw-toggle-custom {
      position: absolute;
      right: 18px;
      border: none;
      background: none;
      color: #7a6350;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 0;
    }

    .pw-toggle-custom:hover {
      color: #2c1a0e;
    }

    .btn-submit-custom {
      width: 100%;
      padding: 14px;
      background: #3e2513;
      color: #ffffff;
      border: none;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(62, 37, 19, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit-custom:hover {
      background: #2c1a0e;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(62, 37, 19, 0.3);
    }

    .btn-submit-custom:active {
      transform: translateY(0);
    }

    .btn-submit-custom:disabled {
      background: #7a6350;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .demo-cred-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: var(--space-5);
      font-size: 0.75rem;
      color: #a48e7e;
      gap: var(--space-3);
    }

    .demo-cred-line {
      flex: 1;
      height: 1px;
      background: #ebdcd0;
    }

    .login-footer-custom {
      text-align: center;
      margin-top: var(--space-6);
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body class="admin-login-body">

  <!-- Header Brand -->
  <div class="brand-container">
    <div class="logo-frame">
      <img src="../images/logo.png" alt="Logo Uncle Joe">
    </div>
    <div class="brand-title">Uncle Joe</div>
    <div class="brand-subtitle">Coffee & Kitchen</div>
  </div>

  <!-- Card Form -->
  <div class="login-card-custom">
    <div class="card-header-custom">
      <div class="card-title-custom">Masuk ke Akun</div>
      <div class="card-subtitle-custom">Silakan login untuk mengakses sistem</div>
    </div>

    <div class="card-body-custom">
      <form id="loginForm">
        <!-- Username -->
        <div class="form-group-custom">
          <label class="form-label-custom" for="username">Username</label>
          <div class="input-wrapper-custom">
            <i data-lucide="user" class="input-icon-custom" style="width:18px;height:18px;"></i>
            <input type="text" id="username" class="form-control-custom" placeholder="Masukkan username" required autocomplete="username">
          </div>
        </div>

        <!-- Password -->
        <div class="form-group-custom" style="margin-bottom:var(--space-4);">
          <label class="form-label-custom" for="password">Password</label>
          <div class="input-wrapper-custom">
            <i data-lucide="lock" class="input-icon-custom" style="width:18px;height:18px;"></i>
            <input type="password" id="password" class="form-control-custom" placeholder="Masukkan password" required autocomplete="current-password">
            <button type="button" class="pw-toggle-custom" id="pwToggle" onclick="togglePw()">
              <i data-lucide="eye" style="width:18px;height:18px;" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <!-- Forgot Password link simulation -->
        <a href="#" class="forgot-pw-link" onclick="alert('Silakan hubungi administrator utama untuk reset password Anda.'); return false;">Lupa password?</a>

        <!-- Submit Button -->
        <button type="submit" id="btnLogin" class="btn-submit-custom">
          Masuk
        </button>

        <!-- Demo Credentials -->
        <div class="demo-cred-divider">
          <div class="demo-cred-line"></div>
          <span>demo: admin / admin123</span>
          <div class="demo-cred-line"></div>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <div class="login-footer-custom">
    <div style="margin-bottom: 8px;">© 2025 Uncle Joe Coffee & Kitchen</div>
    <a href="../index.html" style="color: rgba(255,255,255,0.4); text-decoration: underline; font-size: 0.75rem; display: inline-flex; align-items: center; gap: 4px;">
      <i data-lucide="arrow-left" style="width: 12px; height: 12px;"></i> Kembali ke Halaman Utama
    </a>
  </div>

  <script>
    lucide.createIcons();

    // Redirect jika sudah login
    if (localStorage.getItem('admin_token')) {
      window.location.href = 'dashboard.html';
    }

    // Toggle visibilitas password
    let pwVisible = false;
    function togglePw() {
      pwVisible = !pwVisible;
      document.getElementById('password').type = pwVisible ? 'text' : 'password';
      document.getElementById('eyeIcon').setAttribute('data-lucide', pwVisible ? 'eye-off' : 'eye');
      lucide.createIcons();
    }

    // Submit Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      btn.disabled = true;
      btn.innerHTML = '<i data-lucide="loader-circle" style="width:18px;height:18px;animation: spin 1s linear infinite;"></i> Memverifikasi...';
      lucide.createIcons();

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value.trim()
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.pesan || 'Login gagal.');

        localStorage.setItem('admin_token',    data.token);
        localStorage.setItem('admin_username', data.user.username);
        window.location.href = 'dashboard.html';
      } catch (err) {
        alert(err.message);
        btn.disabled = false;
        btn.innerHTML = 'Masuk';
        lucide.createIcons();
      }
    });
  </script>
  
  <style>
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</body>
</html>
