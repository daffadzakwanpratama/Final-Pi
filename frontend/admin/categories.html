<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola Kategori — Admin Uncle Joe</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="admin-layout">

  <!-- Sidebar (Desktop) -->
  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo" style="display:flex;align-items:center;gap:10px;">
        <img src="../images/Logo-Terbaru.svg" alt="Logo" style="width:38px;height:38px;object-fit:cover;border-radius:50%;flex-shrink:0;background:#000000;border:1px solid rgba(255,255,255,0.15);">
        <div>
          <div class="sidebar-logo-text">Uncle Joe</div>
          <div class="sidebar-logo-sub">Admin Panel</div>
        </div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-nav-item">
        <a href="dashboard.html" class="sidebar-nav-link">
          <i data-lucide="layout-dashboard" style="width:17px;height:17px;"></i>
          Dashboard
        </a>
      </div>
      <div class="sidebar-nav-item">
        <a href="orders.html" class="sidebar-nav-link">
          <i data-lucide="clipboard-list" style="width:17px;height:17px;"></i>
          Pesanan
        </a>
      </div>
      <div class="sidebar-nav-item">
        <a href="menu.html" class="sidebar-nav-link">
          <i data-lucide="utensils" style="width:17px;height:17px;"></i>
          Menu
        </a>
      </div>
      <div class="sidebar-nav-item">
        <a href="categories.html" class="sidebar-nav-link active">
          <i data-lucide="tags" style="width:17px;height:17px;"></i>
          Kategori
        </a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <button onclick="logout()" class="sidebar-nav-link" style="width:100%;border:none;cursor:pointer;background:none;">
        <i data-lucide="log-out" style="width:17px;height:17px;"></i>
        Keluar
      </button>
    </div>
  </aside>

  <!-- Konten Utama -->
  <div class="admin-content">
    <!-- Topbar -->
    <div class="admin-topbar">
      <div>
        <div class="admin-topbar-title">Kelola Kategori</div>
        <div class="admin-topbar-sub">Tambah, ubah nama, atau hapus kategori menu</div>
      </div>
      <button onclick="openCatModal('add')" class="btn btn-primary btn-sm" style="width:auto;">
        <i data-lucide="plus" style="width:16px;height:16px;"></i> Tambah Kategori
      </button>
    </div>

    <!-- Halaman Admin Page Wrapper -->
    <div class="admin-page admin-page-with-bottom">
      <div class="card">
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th style="width: 80px;"># ID</th>
                <th>Nama Kategori</th>
                <th style="width: 200px;">Aksi</th>
              </tr>
            </thead>
            <tbody id="catTableBody">
              <tr>
                <td colspan="3" style="text-align:center;padding:var(--space-8);color:var(--text-muted);">
                  <i data-lucide="loader-circle" style="width:24px;height:24px;margin:0 auto var(--space-3) auto;display:block;"></i>
                  Memuat daftar kategori...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Bottom Nav (Mobile) -->
    <nav class="admin-mobile-nav">
      <a href="dashboard.html" class="admin-mobile-nav-item">
        <i data-lucide="layout-dashboard" style="width:20px;height:20px;"></i> Dashboard
      </a>
      <a href="orders.html" class="admin-mobile-nav-item">
        <i data-lucide="clipboard-list" style="width:20px;height:20px;"></i> Pesanan
      </a>
      <a href="menu.html" class="admin-mobile-nav-item">
        <i data-lucide="utensils" style="width:20px;height:20px;"></i> Menu
      </a>
      <a href="categories.html" class="admin-mobile-nav-item active">
        <i data-lucide="tags" style="width:20px;height:20px;"></i> Kategori
      </a>
      <button onclick="logout()" class="admin-mobile-nav-item">
        <i data-lucide="log-out" style="width:20px;height:20px;"></i> Keluar
      </button>
    </nav>
  </div>

  <!-- Modal Tambah/Edit Kategori -->
  <div class="admin-modal-overlay" id="catModal">
    <div class="admin-modal-box">
      <div class="admin-modal-header">
        <h3 id="modalTitle">Tambah Kategori</h3>
        <button onclick="closeCatModal()" class="btn btn-ghost btn-sm" style="width:auto;padding:4px;">
          <i data-lucide="x" style="width:18px;height:18px;"></i>
        </button>
      </div>
      <div class="admin-modal-body">
        <form id="catForm" onsubmit="event.preventDefault(); submitCat();">
          <input type="hidden" id="catIdField">
          <div class="form-group">
            <label class="form-label" for="namaKategori">Nama Kategori</label>
            <input type="text" id="namaKategori" class="form-control" placeholder="Contoh: Coffee Blend" required>
          </div>
        </form>
      </div>
      <div class="admin-modal-footer">
        <button type="button" onclick="closeCatModal()" class="btn btn-secondary btn-sm" style="width:auto;">Batal</button>
        <button type="button" id="btnSimpanCat" onclick="submitCat()" class="btn btn-primary btn-sm" style="width:auto;">
          <i data-lucide="save" style="width:14px;height:14px;"></i>
          Simpan Kategori
        </button>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
    const token = localStorage.getItem('admin_token');
    if (!token) { alert('Akses ditolak.'); window.location.href = 'login.html'; }

    let allCategories = [];
    let modalMode = 'add';

    async function loadCategories() {
      try {
        const res = await fetch('/api/categories');
        if (!res.ok) throw new Error();
        allCategories = await res.json();
        renderCatTable();
      } catch {
        alert('Gagal mengambil daftar kategori.');
      }
    }

    function renderCatTable() {
      const tbody = document.getElementById('catTableBody');
      if (!allCategories.length) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;padding:var(--space-8);color:var(--text-muted);">
          <i data-lucide="package-open" style="width:32px;height:32px;margin:0 auto var(--space-3) auto;display:block;"></i>
          Belum ada kategori terdaftar. Tambahkan kategori baru.
        </td></tr>`;
        lucide.createIcons();
        return;
      }

      tbody.innerHTML = allCategories.map(cat => {
        return `
          <tr>
            <td style="color:var(--text-muted);font-size:0.82rem;">#${cat.id}</td>
            <td style="font-weight:600;color:var(--text-primary);">${cat.nama}</td>
            <td>
              <div style="display:flex;gap:var(--space-2);">
                <button onclick="editCatPrep(${cat.id})" class="btn btn-secondary btn-sm" style="width:auto;">
                  <i data-lucide="pencil" style="width:13px;height:13px;"></i> Edit
                </button>
                <button onclick="hapusCat(${cat.id}, '${cat.nama.replace(/'/g, "\\'")}')" class="btn btn-danger btn-sm" style="width:auto;">
                  <i data-lucide="trash-2" style="width:13px;height:13px;"></i> Hapus
                </button>
              </div>
            </td>
          </tr>`;
      }).join('');
      lucide.createIcons();
    }

    function openCatModal(mode) {
      modalMode = mode;
      document.getElementById('catForm').reset();
      document.getElementById('catIdField').value = '';
      document.getElementById('modalTitle').textContent = mode === 'add' ? 'Tambah Kategori Baru' : 'Edit Nama Kategori';
      document.getElementById('catModal').classList.add('show');
      lucide.createIcons();
    }

    function closeCatModal() {
      document.getElementById('catModal').classList.remove('show');
    }

    function editCatPrep(id) {
      const cat = allCategories.find(c => c.id === id);
      if (!cat) return;
      openCatModal('edit');
      document.getElementById('catIdField').value = cat.id;
      document.getElementById('namaKategori').value = cat.nama;
    }

    async function submitCat() {
      const id   = document.getElementById('catIdField').value;
      const nama = document.getElementById('namaKategori').value.trim();

      if (!nama) { alert('Nama kategori wajib diisi.'); return; }

      const url    = modalMode === 'edit' ? `/api/categories/${id}` : '/api/categories';
      const method = modalMode === 'edit' ? 'PUT' : 'POST';

      const btn = document.getElementById('btnSimpanCat');
      btn.disabled = true;
      btn.innerHTML = '<i data-lucide="loader-circle" style="width:14px;height:14px;"></i> Menyimpan...';
      lucide.createIcons();

      try {
        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ nama })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.pesan || 'Gagal menyimpan.');
        closeCatModal();
        loadCategories();
      } catch (err) {
        alert(err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="save" style="width:14px;height:14px;"></i> Simpan Kategori';
        lucide.createIcons();
      }
    }

    async function hapusCat(id, nama) {
      if (!confirm(`Hapus kategori "${nama}"? Menu yang terikat dengan kategori ini tidak akan otomatis terhapus.`)) return;
      try {
        const res = await fetch(`/api/categories/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.pesan || 'Gagal menghapus.');
        loadCategories();
      } catch (err) {
        alert(err.message);
      }
    }

    function logout() {
      localStorage.removeItem('admin_token');
      localStorage.removeItem('admin_username');
      window.location.href = 'login.html';
    }

    document.getElementById('catModal').addEventListener('click', function(e) {
      if (e.target === this) closeCatModal();
    });

    loadCategories();
  </script>
</body>
</html>
