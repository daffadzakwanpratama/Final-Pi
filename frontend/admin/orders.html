<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola Pesanan — Admin Uncle Jo</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="admin-layout">

  <!-- Sidebar (Desktop) -->
  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo" style="display:flex;align-items:center;gap:10px;">
        <img src="../images/Logo-Terbaru.svg" alt="Logo" style="width:38px;height:38px;object-fit:cover;border-radius:50%;flex-shrink:0;background:#000000;border:1px solid rgba(255,255,255,0.15);">
        <div>
          <div class="sidebar-logo-text">Uncle Jo</div>
          <div class="sidebar-logo-sub">Admin Panel</div>
        </div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-nav-item">
        <a href="dashboard.html" class="sidebar-nav-link">
          <i data-lucide="layout-dashboard" style="width:17px;height:17px;"></i>
          Dashboard
        </a>
      </div>
      <div class="sidebar-nav-item">
        <a href="orders.html" class="sidebar-nav-link active">
          <i data-lucide="clipboard-list" style="width:17px;height:17px;"></i>
          Pesanan
        </a>
      </div>
      <div class="sidebar-nav-item">
        <a href="menu.html" class="sidebar-nav-link">
          <i data-lucide="utensils" style="width:17px;height:17px;"></i>
          Menu
        </a>
      </div>
      <div class="sidebar-nav-item">
        <a href="categories.html" class="sidebar-nav-link">
          <i data-lucide="tags" style="width:17px;height:17px;"></i>
          Kategori
        </a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <button onclick="logout()" class="sidebar-nav-link" style="width:100%;border:none;cursor:pointer;background:none;">
        <i data-lucide="log-out" style="width:17px;height:17px;"></i>
        Keluar
      </button>
    </div>
  </aside>

  <!-- Konten Utama -->
  <div class="admin-content">

    <!-- Topbar -->
    <div class="admin-topbar">
      <div>
        <div class="admin-topbar-title">Antrean Pesanan</div>
        <div class="admin-topbar-sub">Kelola dan pantau proses pesanan masuk secara real-time</div>
      </div>
      <div style="display:flex;align-items:center;padding-right:12px;gap:12px;">
        <button onclick="loadOrders()" class="btn btn-secondary btn-sm" style="width:auto;display:flex;align-items:center;gap:6px;">
          <i data-lucide="refresh-cw" style="width:14px;height:14px;"></i> Refresh
        </button>
        <button onclick="clearTodayOrders()" class="btn btn-sm" style="width:auto;font-size:0.72rem;padding:6px 12px;color:#dc2626;border:1px solid #fecaca;background:#fef2f2;display:flex;align-items:center;gap:4px;cursor:pointer;font-weight:600;border-radius:6px;">
          <i data-lucide="trash-2" style="width:12px;height:12px;"></i> Bersihkan Hari Ini
        </button>
      </div>
    </div>

    <!-- Page Content -->
    <div class="admin-page admin-page-with-bottom">

      <!-- Filter Kategori Tabs -->
      <div class="filter-tabs">
        <button onclick="setFilter('Semua', this)" class="filter-tab active">
          Semua
        </button>
        <button onclick="setFilter('Menunggu', this)" class="filter-tab">
          Menunggu <span class="filter-badge badge-menunggu" id="badge-Menunggu"></span>
        </button>
        <button onclick="setFilter('Diproses', this)" class="filter-tab">
          Diproses <span class="filter-badge badge-diproses" id="badge-Diproses"></span>
        </button>
        <button onclick="setFilter('Siap', this)" class="filter-tab">
          Siap Diambil <span class="filter-badge badge-siap" id="badge-Siap"></span>
        </button>
        <button onclick="setFilter('Selesai', this)" class="filter-tab">
          Selesai
        </button>
      </div>

      <!-- Grid Pesanan -->
      <div class="orders-grid" id="ordersContainer">
        <div style="grid-column:1/-1;text-align:center;padding:var(--space-12);color:var(--text-muted);">
          <i data-lucide="loader-circle" style="width:32px;height:32px;margin:0 auto var(--space-4) auto;display:block;"></i>
          Memuat antrean...
        </div>
      </div>

    </div>

    <!-- Bottom Nav (Mobile) -->
    <nav class="admin-mobile-nav">
      <a href="dashboard.html" class="admin-mobile-nav-item">
        <i data-lucide="layout-dashboard" style="width:20px;height:20px;"></i> Dashboard
      </a>
      <a href="orders.html" class="admin-mobile-nav-item active">
        <i data-lucide="clipboard-list" style="width:20px;height:20px;"></i> Pesanan
      </a>
      <a href="menu.html" class="admin-mobile-nav-item">
        <i data-lucide="utensils" style="width:20px;height:20px;"></i> Menu
      </a>
      <a href="categories.html" class="admin-mobile-nav-item">
        <i data-lucide="tags" style="width:20px;height:20px;"></i> Kategori
      </a>
      <button onclick="logout()" class="admin-mobile-nav-item">
        <i data-lucide="log-out" style="width:20px;height:20px;"></i> Keluar
      </button>
    </nav>

  </div>

  <script src="../js/api.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
