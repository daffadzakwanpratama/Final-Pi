<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uncle Jo — Scan & Pesan</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="landing-body">
  <div class="landing-wrapper">
    <!-- Logo Hero -->
    <div style="width:90px;height:90px;margin-bottom:var(--space-5);border-radius:50%;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,0.3);background:#000000;border:1px solid rgba(255,255,255,0.12);">
      <img src="images/Logo-Terbaru.svg" alt="Logo Uncle Jo" style="width:100%;height:100%;object-fit:cover;display:block;">
    </div>

    <h1 class="hero-title">Uncle <span>Jo</span></h1>
    <p class="hero-subtitle">Pesan favoritmu langsung dari meja, tanpa antre di kasir.</p>

    <!-- Card Pilih Meja -->
    <div class="scan-card">
      <div class="scan-card-title" style="justify-content: center; font-size: 1.1rem; gap: 8px;">
        <i data-lucide="armchair" style="width:22px;height:22px;color:var(--coffee-600);"></i>
        Kamu duduk di meja berapa?
      </div>
      <p class="scan-card-subtitle">Silakan pilih nomor meja tempat Anda berada:</p>

      <div class="table-grid">
        <button class="table-btn" onclick="selectMeja(1)">
          <span class="table-num">1</span>
          <span class="table-label">Meja 1</span>
        </button>
        <button class="table-btn" onclick="selectMeja(2)">
          <span class="table-num">2</span>
          <span class="table-label">Meja 2</span>
        </button>
        <button class="table-btn" onclick="selectMeja(3)">
          <span class="table-num">3</span>
          <span class="table-label">Meja 3</span>
        </button>
        <button class="table-btn" onclick="selectMeja(4)">
          <span class="table-num">4</span>
          <span class="table-label">Meja 4</span>
        </button>
        <button class="table-btn" onclick="selectMeja(5)">
          <span class="table-num">5</span>
          <span class="table-label">Meja 5</span>
        </button>
        <button class="table-btn" onclick="selectMeja(6)">
          <span class="table-num">6</span>
          <span class="table-label">Meja 6</span>
        </button>
      </div>
    </div>
  </div>

  <script src="js/index.js"></script>
</body>
</html>
