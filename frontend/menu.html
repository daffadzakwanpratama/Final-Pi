<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu — Uncle Joe</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    body { background: var(--surface-cream); }
    .content { padding: var(--space-5) 0 var(--space-10) 0; }
    .section-title {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: var(--space-4);
      padding: 0 var(--space-5);
    }
    .menu-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-4); padding: 0 var(--space-5); }
    .empty-state {
      text-align: center;
      padding: var(--space-12) var(--space-5);
      color: var(--text-muted);
    }
    .empty-state-icon { margin: 0 auto var(--space-4) auto; color: var(--coffee-200); }
    .modal-overlay { position: fixed; }
    .modal-close-btn { position: absolute; }
  </style>
</head>
<body class="page-wrapper">

  <!-- Navbar -->
  <header class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-brand">
        <i data-lucide="coffee" style="width:20px;height:20px;color:var(--coffee-500);"></i>
        Uncle <span>Joe</span>
      </a>
      <div class="navbar-right">
        <div class="meja-badge" id="mejaBadge">
          <i data-lucide="armchair" style="width:12px;height:12px;"></i>
          Meja —
        </div>
        <a href="cart.html" class="cart-btn" id="cartBtn">
          <i data-lucide="shopping-cart" style="width:18px;height:18px;"></i>
          <span class="cart-count" id="cartCount">0</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Filter Kategori -->
  <div style="background: var(--surface-white); border-bottom: 1px solid var(--border);">
    <div class="category-scroll" id="categoryScroll">
      <!-- Dimuat secara dinamis -->
    </div>
  </div>

  <!-- Konten Menu -->
  <main class="content">
    <div class="section-title" id="sectionTitle">Semua Menu</div>
    <div class="menu-list" id="menuList">
      <div class="empty-state">
        <div class="empty-state-icon"><i data-lucide="loader-circle" style="width:40px;height:40px;" id="loadingIcon"></i></div>
        <p>Memuat menu...</p>
      </div>
    </div>
  </main>

  <!-- Modal Detail Menu -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-box" style="position:relative;">
      <img id="modalImg" class="modal-img" src="" alt="">
      <button class="modal-close-btn" onclick="closeModal()">
        <i data-lucide="x" style="width:16px;height:16px;"></i>
      </button>
      <div class="modal-body">
        <span id="modalKategori" class="badge" style="background:var(--surface-beige);color:var(--coffee-600);border-color:var(--border);margin-bottom:var(--space-3);"></span>
        <div style="font-size:1.3rem;font-weight:800;color:var(--text-primary);margin-bottom:4px;" id="modalNama">-</div>
        <div style="font-size:1.1rem;font-weight:700;color:var(--coffee-600);margin-bottom:var(--space-4);" id="modalHarga">-</div>
        
        <!-- Deskripsi Menu -->
        <div id="modalDeskripsi" style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:var(--space-5);line-height:1.5;">-</div>
        
        <!-- Varian Section -->
        <div id="variantSection" style="margin-bottom:var(--space-5);display:none;">
          <div style="font-size:0.75rem;font-weight:700;color:var(--text-secondary);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px;">Pilih Varian</div>
          <div style="display:flex;gap:var(--space-2);">
            <label style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:var(--radius-md);border:1.5px solid var(--border);cursor:pointer;font-weight:600;font-size:0.85rem;transition:var(--transition);" class="variant-opt" id="optHot" onclick="selectVariant('Hot')">
              <input type="radio" name="variantOpt" value="Hot" style="display:none;">
              <i data-lucide="flame" style="width:14px;height:14px;color:#dc2626;"></i> Hot
            </label>
            <label style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:var(--radius-md);border:1.5px solid var(--border);cursor:pointer;font-weight:600;font-size:0.85rem;transition:var(--transition);" class="variant-opt" id="optIce" onclick="selectVariant('Ice')">
              <input type="radio" name="variantOpt" value="Ice" style="display:none;">
              <i data-lucide="snowflake" style="width:14px;height:14px;color:#2563eb;"></i> Ice
            </label>
          </div>
        </div>

        <button class="btn btn-primary btn-full btn-lg" id="btnAddToCart">
          <i data-lucide="plus" style="width:18px;height:18px;"></i>
          Tambah ke Keranjang
        </button>
      </div>
    </div>
  </div>

  <script>
    let listMenu = [];
    let kategoriAktif = 'Semua';

    // Ambil nomor meja dari URL / localStorage
    const urlParams = new URLSearchParams(window.location.search);
    let noMeja = urlParams.get('meja');
    if (noMeja) { localStorage.setItem('nomor_meja', noMeja); }
    else { noMeja = localStorage.getItem('nomor_meja'); }

    if (!noMeja) { window.location.href = 'index.html'; }

    document.getElementById('mejaBadge').innerHTML = `<i data-lucide="armchair" style="width:12px;height:12px;"></i> Meja ${noMeja}`;
    lucide.createIcons();

    function getCategoryIcon(name) {
      const n = name.toLowerCase();
      if (n.includes('minum') || n.includes('drink') || n.includes('kopi') || n.includes('coffee') || n.includes('tea') || n.includes('susu')) return 'cup-soda';
      if (n.includes('makan') || n.includes('food') || n.includes('rice') || n.includes('mie') || n.includes('daging')) return 'utensils';
      if (n.includes('cemil') || n.includes('snack') || n.includes('kue') || n.includes('roti') || n.includes('cookie') || n.includes('goreng')) return 'cookie';
      return 'tag';
    }

    async function loadCategories() {
      try {
        const res = await fetch('/api/categories');
        if (!res.ok) throw new Error();
        listCategories = await res.json();
        renderCategoryChips();
      } catch {
        console.error('Gagal memuat kategori.');
      }
    }

    function renderCategoryChips() {
      const container = document.getElementById('categoryScroll');
      let chipsHtml = `
        <button class="category-chip active" onclick="filterKategori('Semua', this)">
          <i data-lucide="layout-grid" style="width:13px;height:13px;"></i> Semua
        </button>
      `;

      chipsHtml += listCategories.map(cat => {
        const iconName = getCategoryIcon(cat.nama);
        return `
          <button class="category-chip" onclick="filterKategori('${cat.nama}', this)">
            <i data-lucide="${iconName}" style="width:13px;height:13px;"></i> ${cat.nama}
          </button>
        `;
      }).join('');

      container.innerHTML = chipsHtml;
      lucide.createIcons();
    }

    // Ambil daftar menu dari server
    async function loadMenu() {
      try {
        const res = await fetch('/api/menu');
        if (!res.ok) throw new Error('Gagal memuat menu');
        listMenu = await res.json();
        renderMenu();
      } catch (err) {
        document.getElementById('menuList').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon"><i data-lucide="wifi-off" style="width:40px;height:40px;"></i></div>
            <p>Gagal memuat menu. Periksa koneksi Anda.</p>
          </div>`;
        lucide.createIcons();
      }
    }

    // Render kartu menu
    function renderMenu() {
      const list = document.getElementById('menuList');
      const filtered = listMenu.filter(m => kategoriAktif === 'Semua' || m.kategori === kategoriAktif);

      if (filtered.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon"><i data-lucide="package-open" style="width:40px;height:40px;"></i></div>
            <p>Belum ada menu untuk kategori ini.</p>
          </div>`;
        lucide.createIcons();
        return;
      }

      list.innerHTML = filtered.map(m => {
        return `
          <div class="menu-card" onclick="openModal(${m.id})">
            <img class="menu-card-img" src="${m.gambar || 'https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=400'}" alt="${m.nama}" onerror="this.src='https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=400'">
            <div class="menu-card-body">
              <div class="menu-card-nama">${m.nama}</div>
              <div class="menu-card-footer">
                <div class="menu-card-harga" style="font-size:0.75rem;">
                  <span>${m.is_hot_ice ? 'Mulai' : 'Rp'}</span>
                  <span>${m.is_hot_ice ? Math.min(m.harga_hot || 0, m.harga_ice || 0).toLocaleString('id-ID') : m.harga.toLocaleString('id-ID')}</span>
                </div>
                <button class="menu-card-add-btn" onclick="event.stopPropagation(); addToCart(${m.id}, true)">
                  Pesan
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    // Filter kategori
    function filterKategori(kat, el) {
      kategoriAktif = kat;
      document.getElementById('sectionTitle').textContent = `${kat === 'Semua' ? 'Semua' : kat} Menu`;
      document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      renderMenu();
    }

    // Modal
    function openModal(id) {
      const m = listMenu.find(x => x.id === id);
      if (!m) return;
      document.getElementById('modalImg').src = m.gambar || 'https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=400';
      document.getElementById('modalNama').textContent = m.nama;
      document.getElementById('modalKategori').textContent = m.kategori;
      document.getElementById('modalDeskripsi').textContent = m.deskripsi || 'Tidak ada deskripsi untuk menu ini.';
      
      const vSec = document.getElementById('variantSection');
      if (m.is_hot_ice) {
        vSec.style.display = 'block';
        
        // Overwrite click events untuk meneruskan menu ID
        document.getElementById('optHot').onclick = () => selectVariant('Hot', id);
        document.getElementById('optIce').onclick = () => selectVariant('Ice', id);
        
        selectVariant('Ice', id); // Default ke Ice
      } else {
        vSec.style.display = 'none';
        document.getElementById('modalHarga').textContent = `Rp ${m.harga.toLocaleString('id-ID')}`;
      }

      document.getElementById('btnAddToCart').onclick = () => addToCart(id, false);
      document.getElementById('detailModal').classList.add('show');
    }

    function selectVariant(val, menuId) {
      document.querySelectorAll('.variant-opt').forEach(el => {
        el.style.borderColor = 'var(--border)';
        el.style.background = 'var(--surface-white)';
        el.style.color = 'var(--text-secondary)';
      });
      const selected = document.getElementById(val === 'Hot' ? 'optHot' : 'optIce');
      selected.style.borderColor = 'var(--primary)';
      selected.style.background = 'var(--primary-light)';
      selected.style.color = 'var(--primary)';
      selected.querySelector('input').checked = true;

      // Update harga modal sesuai varian
      const m = listMenu.find(x => x.id === menuId);
      if (m) {
        const hargaVarian = val === 'Hot' ? m.harga_hot : m.harga_ice;
        document.getElementById('modalHarga').textContent = `Rp ${hargaVarian.toLocaleString('id-ID')}`;
      }
    }

    function closeModal() {
      document.getElementById('detailModal').classList.remove('show');
    }

    // Keranjang
    function addToCart(id, checkVarian = false) {
      const m = listMenu.find(x => x.id === id);
      if (!m) return;

      // Jika memesan langsung dari kartu menu grid luar dan memiliki varian hot/ice, buka modal dahulu
      if (checkVarian && m.is_hot_ice) {
        openModal(id);
        return;
      }

      let selectedVarian = null;
      let finalHarga = m.harga;

      if (m.is_hot_ice) {
        const checked = document.querySelector('input[name="variantOpt"]:checked');
        if (checked) {
          selectedVarian = checked.value;
          finalHarga = selectedVarian === 'Hot' ? m.harga_hot : m.harga_ice;
        }
      }

      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      const idx = cart.findIndex(c => c.id === id && c.varian === selectedVarian);
      if (idx > -1) { 
        cart[idx].qty++; 
      } else { 
        cart.push({ 
          id: m.id, 
          nama: m.nama, 
          harga: finalHarga, 
          gambar: m.gambar, 
          qty: 1, 
          varian: selectedVarian 
        }); 
      }
      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartBadge();
      closeModal();
      
      const vSuffix = selectedVarian ? ` (${selectedVarian})` : '';
      alert(`✓ "${m.nama}${vSuffix}" telah dimasukkan ke keranjang!`);
    }

    function updateCartBadge() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const total = cart.reduce((s, c) => s + c.qty, 0);
      const badge = document.getElementById('cartCount');
      badge.textContent = total;
      if (total > 0) { badge.classList.add('show'); } else { badge.classList.remove('show'); }
    }

    // Tutup modal jika klik overlay
    document.getElementById('detailModal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    async function initPage() {
      await loadCategories();
      await loadMenu();
      updateCartBadge();
    }
    initPage();
  </script>
</body>
</html>
