<!--
==============================================================================
HALAMAN MANAGEMENT MENU PRODUK KAFE (frontend/admin/menu.html)
==============================================================================

TUJUAN & FUNGSI FILE:
1. Menyediakan tampilan antarmuka tabel CRUD menu makanan & minuman.
2. Mengizinkan upload gambar, atur varian Hot/Ice, dan status menu favorit/habis.

ALUR KERJA (DATA FLOW):
Masuk dari: Menu navigasi admin (sidebar).
Keluar ke: Mengirim request CRUD ke API backend /api/menu.
==============================================================================
-->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola Menu — Admin Uncle Jo</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="admin-layout">

  <!-- Sidebar (Desktop) -->
  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo" style="display:flex;align-items:center;gap:10px;">
        <img src="../images/Logo-Terbaru.svg" alt="Logo" style="width:38px;height:38px;object-fit:cover;border-radius:50%;flex-shrink:0;background:#000000;border:1px solid rgba(255,255,255,0.15);">
        <div>
          <div class="sidebar-logo-text">Uncle Jo</div>
          <div class="sidebar-logo-sub">Admin Panel</div>
        </div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-nav-item">
        <a href="dashboard.html" class="sidebar-nav-link">
          <i data-lucide="layout-dashboard" style="width:17px;height:17px;"></i>
          Dashboard
        </a>
      </div>
      <div class="sidebar-nav-item">
        <a href="orders.html" class="sidebar-nav-link">
          <i data-lucide="clipboard-list" style="width:17px;height:17px;"></i>
          Pesanan
        </a>
      </div>
      <div class="sidebar-nav-item">
        <a href="menu.html" class="sidebar-nav-link active">
          <i data-lucide="utensils" style="width:17px;height:17px;"></i>
          Menu
        </a>
      </div>
      <div class="sidebar-nav-item">
        <a href="categories.html" class="sidebar-nav-link">
          <i data-lucide="tags" style="width:17px;height:17px;"></i>
          Kategori
        </a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <button onclick="logout()" class="sidebar-nav-link" style="width:100%;border:none;cursor:pointer;background:none;">
        <i data-lucide="log-out" style="width:17px;height:17px;"></i>
        Keluar
      </button>
    </div>
  </aside>

  <!-- Konten Utama -->
  <div class="admin-content">
    <!-- Topbar -->
    <div class="admin-topbar">
      <div>
        <div class="admin-topbar-title">Kelola Menu</div>
        <div class="admin-topbar-sub">Tambah, edit, atau hapus item menu cafe</div>
      </div>
      <button onclick="openMenuModal('add')" class="btn btn-primary btn-sm">
        <i data-lucide="plus" style="width:15px;height:15px;"></i>
        Tambah Menu
      </button>
    </div>

    <!-- Page Content -->
    <div class="admin-page admin-page-with-bottom">
      <div class="card">
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>#</th>
                <th>Gambar</th>
                <th>Nama Menu & Deskripsi</th>
                <th>Kategori</th>
                <th>Varian</th>
                <th>Harga</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="menuTableBody">
              <tr>
                <td colspan="7" style="text-align:center;padding:var(--space-8);color:var(--text-muted);">
                  <i data-lucide="loader-circle" style="width:24px;height:24px;margin:0 auto var(--space-3) auto;display:block;"></i>
                  Memuat daftar menu...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Bottom Nav (Mobile) -->
    <nav class="admin-mobile-nav">
      <a href="dashboard.html" class="admin-mobile-nav-item">
        <i data-lucide="layout-dashboard" style="width:20px;height:20px;"></i> Dashboard
      </a>
      <a href="orders.html" class="admin-mobile-nav-item">
        <i data-lucide="clipboard-list" style="width:20px;height:20px;"></i> Pesanan
      </a>
      <a href="menu.html" class="admin-mobile-nav-item active">
        <i data-lucide="utensils" style="width:20px;height:20px;"></i> Menu
      </a>
      <a href="categories.html" class="admin-mobile-nav-item">
        <i data-lucide="tags" style="width:20px;height:20px;"></i> Kategori
      </a>
      <button onclick="logout()" class="admin-mobile-nav-item">
        <i data-lucide="log-out" style="width:20px;height:20px;"></i> Keluar
      </button>
    </nav>
  </div>

  <!-- Modal Kelola Menu -->
  <div class="admin-modal-overlay" id="menuModal">
    <div class="admin-modal-box">
      <div class="admin-modal-header">
        <h3 id="modalTitle">Tambah Menu Baru</h3>
        <button onclick="closeMenuModal()" style="border:none;background:none;cursor:pointer;color:var(--text-muted);">
          <i data-lucide="x" style="width:16px;height:16px;"></i>
        </button>
      </div>
      <div class="admin-modal-body">
        <form id="menuForm" onsubmit="event.preventDefault(); submitMenu();">
          <input type="hidden" id="menuIdField">
          
          <div class="form-group">
            <label class="form-label">Nama Menu</label>
            <input type="text" id="namaMenu" class="form-control" placeholder="Masukkan nama menu" required>
          </div>

          <div class="form-group">
            <label class="form-label">Kategori</label>
            <select id="kategoriMenu" class="form-control" style="background-image:none;" required>
              <!-- Dimuat dinamis -->
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" style="display:flex;align-items:center;gap:6px;">
              <input type="checkbox" id="isHotIceMenu" onchange="toggleHargaVarian()">
              <span>Menu ini memiliki Varian (Hot / Ice)?</span>
            </label>
          </div>

          <!-- Input Harga Normal -->
          <div class="form-group" id="hargaNormalGroup">
            <label class="form-label">Harga (Rp)</label>
            <input type="number" id="hargaMenu" class="form-control" placeholder="Masukkan harga menu" required min="0">
          </div>

          <!-- Input Harga Varian -->
          <div id="hargaVarianContainer" style="display:none;gap:var(--space-3);margin-bottom:var(--space-4);">
            <div class="form-group" style="flex:1;margin-bottom:0;">
              <label class="form-label">Harga Hot (Rp)</label>
              <input type="number" id="hargaHotMenu" class="form-control" placeholder="Hot" min="0">
            </div>
            <div class="form-group" style="flex:1;margin-bottom:0;">
              <label class="form-label">Harga Ice (Rp)</label>
              <input type="number" id="hargaIceMenu" class="form-control" placeholder="Ice" min="0">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" style="display:flex;align-items:center;gap:6px;">
              <input type="checkbox" id="isFavoritMenu">
              <span>Tandai sebagai Menu Favorit</span>
            </label>
          </div>

          <div class="form-group">
            <label class="form-label">Deskripsi</label>
            <textarea id="deskripsiMenu" class="form-control" style="height:80px;resize:none;" placeholder="Tulis deskripsi singkat hidangan ini..."></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">Foto Hidangan</label>
            <input type="file" id="fotoMenu" class="form-control" accept="image/*" onchange="handleFileSelect(this)">
            <img id="imgPreview" class="img-preview" src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=500" alt="Preview Gambar">
          </div>

          <div class="admin-modal-footer">
            <button type="button" onclick="closeMenuModal()" class="btn btn-secondary btn-sm" style="width:auto;">Batal</button>
            <button type="submit" id="btnSimpanMenu" class="btn btn-primary btn-sm" style="width:auto;display:flex;align-items:center;gap:6px;">
              <i data-lucide="save" style="width:14px;height:14px;"></i>
              Simpan Menu
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
