<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keranjang — Uncle Joe</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    body { background: var(--surface-cream); }
    .cart-body { padding: var(--space-5); padding-bottom: 120px; }
  </style>
</head>
<body class="page-wrapper">

  <!-- Navbar -->
  <header class="navbar">
    <div class="navbar-inner">
      <a href="menu.html" class="navbar-brand" style="gap:var(--space-2);font-size:0.9rem;">
        <i data-lucide="arrow-left" style="width:18px;height:18px;color:var(--text-secondary);"></i>
        Kembali ke Menu
      </a>
      <div class="navbar-brand">
        <i data-lucide="coffee" style="width:18px;height:18px;color:var(--coffee-500);"></i>
        Keranjang
      </div>
    </div>
  </header>

  <!-- Konten -->
  <main class="cart-body container">

    <!-- Daftar Item -->
    <div class="card mt-5" id="cartCard">
      <div class="card-header" style="display:flex;align-items:center;gap:8px;">
        <i data-lucide="shopping-cart" style="width:17px;height:17px;color:var(--coffee-500);"></i>
        Pesanan Saya
      </div>
      <div class="card-body" id="cartItemsContainer">
        <div style="text-align:center;padding:var(--space-8) 0;color:var(--text-muted);">
          <i data-lucide="loader-circle" style="width:32px;height:32px;margin:0 auto;display:block;margin-bottom:8px;"></i>
          Memuat keranjang...
        </div>
      </div>
    </div>

    <!-- Summary & Checkout -->
    <div id="summarySection" style="display:none;">
      <div class="summary-box mt-4">
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="subtotalVal">Rp 0</span>
        </div>
        <div class="summary-row summary-total">
          <span>Total Pembayaran</span>
          <span id="totalVal">Rp 0</span>
        </div>
      </div>

      <div style="margin-top:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);">
        <a href="checkout.html" class="btn btn-primary btn-full btn-lg">
          <i data-lucide="receipt" style="width:18px;height:18px;"></i>
          Lanjut ke Checkout
        </a>
        <button onclick="clearCart()" class="btn btn-ghost btn-full" style="font-size:0.82rem;color:var(--text-muted);">
          <i data-lucide="trash-2" style="width:15px;height:15px;"></i>
          Kosongkan Keranjang
        </button>
      </div>
    </div>

  </main>

  <script>
    let cart = [];

    function loadCart() {
      cart = JSON.parse(localStorage.getItem('cart')) || [];
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById('cartItemsContainer');
      const summary   = document.getElementById('summarySection');
      lucide.createIcons();

      if (cart.length === 0) {
        container.innerHTML = `
          <div style="text-align:center;padding:var(--space-8) 0;">
            <i data-lucide="shopping-cart" style="width:48px;height:48px;color:var(--coffee-200);margin:0 auto var(--space-4) auto;display:block;"></i>
            <div style="font-weight:600;color:var(--text-secondary);margin-bottom:var(--space-2);">Keranjang kosong</div>
            <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:var(--space-5);">Belum ada menu yang dipilih.</p>
            <a href="menu.html" class="btn btn-primary btn-sm" style="display:inline-flex;">
              <i data-lucide="utensils" style="width:15px;height:15px;"></i> Pilih Menu
            </a>
          </div>`;
        summary.style.display = 'none';
        lucide.createIcons();
        return;
      }

      let total = 0;
      container.innerHTML = cart.map((item, idx) => {
        const subtotal = item.harga * item.qty;
        total += subtotal;
        const img = item.gambar || 'https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=200';
        return `
          <div class="cart-item">
            <img class="cart-item-img" src="${img}" alt="${item.nama}" onerror="this.src='https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=200'">
            <div class="cart-item-info">
              <div class="cart-item-nama">${item.nama}</div>
              <div class="cart-item-harga">Rp ${item.harga.toLocaleString('id-ID')}</div>
              <button onclick="removeItem(${idx})" style="background:none;border:none;color:var(--status-waiting-text);font-size:0.75rem;font-weight:600;cursor:pointer;padding:4px 0;display:flex;align-items:center;gap:4px;font-family:inherit;">
                <i data-lucide="trash-2" style="width:12px;height:12px;"></i> Hapus
              </button>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:var(--space-2);">
              <div class="qty-control">
                <button class="qty-btn" onclick="updateQty(${idx}, -1)">
                  <i data-lucide="minus" style="width:14px;height:14px;"></i>
                </button>
                <span class="qty-value">${item.qty}</span>
                <button class="qty-btn" onclick="updateQty(${idx}, 1)">
                  <i data-lucide="plus" style="width:14px;height:14px;"></i>
                </button>
              </div>
              <div class="cart-item-subtotal">Rp ${subtotal.toLocaleString('id-ID')}</div>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('subtotalVal').textContent = `Rp ${total.toLocaleString('id-ID')}`;
      document.getElementById('totalVal').textContent    = `Rp ${total.toLocaleString('id-ID')}`;
      summary.style.display = 'block';
      lucide.createIcons();
    }

    function updateQty(idx, change) {
      cart[idx].qty += change;
      if (cart[idx].qty <= 0) cart.splice(idx, 1);
      saveAndRender();
    }

    function removeItem(idx) {
      if (confirm(`Hapus "${cart[idx].nama}" dari keranjang?`)) {
        cart.splice(idx, 1);
        saveAndRender();
      }
    }

    function clearCart() {
      if (confirm('Kosongkan seluruh keranjang?')) {
        cart = [];
        saveAndRender();
      }
    }

    function saveAndRender() {
      localStorage.setItem('cart', JSON.stringify(cart));
      renderCart();
    }

    loadCart();
  </script>
</body>
</html>
