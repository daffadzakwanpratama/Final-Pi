<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin — Uncle Joe</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    html, body { height: 100%; }

    body {
      background: var(--coffee-900);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: var(--space-5);
    }

    .login-card {
      background: white;
      border-radius: var(--radius-xl);
      width: 100%;
      max-width: 400px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,0,0,0.3);
    }

    .login-header {
      background: var(--coffee-800);
      padding: var(--space-8) var(--space-6);
      text-align: center;
    }

    .login-logo {
      width: 64px;
      height: 64px;
      border-radius: var(--radius-lg);
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--space-4) auto;
      color: var(--coffee-200);
    }

    .login-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: white;
      margin-bottom: 4px;
    }

    .login-title span { color: var(--coffee-300); }

    .login-subtitle {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.5);
    }

    .login-body { padding: var(--space-6); }

    .pw-wrapper {
      position: relative;
    }

    .pw-wrapper .form-control { padding-right: 44px; }

    .pw-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 0;
    }

    .login-footer {
      padding: var(--space-4) var(--space-6);
      border-top: 1px solid var(--border);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <!-- Header -->
    <div class="login-header">
      <div class="login-logo">
        <i data-lucide="coffee" style="width:32px;height:32px;"></i>
      </div>
      <div class="login-title">Uncle <span>Joe</span></div>
      <div class="login-subtitle">Panel Admin — Masuk untuk mengelola pesanan</div>
    </div>

    <!-- Form -->
    <div class="login-body">
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="username">
            <i data-lucide="user" style="width:13px;height:13px;display:inline;vertical-align:middle;margin-right:4px;"></i>
            Username
          </label>
          <input type="text" id="username" class="form-control" placeholder="Masukkan username" required autocomplete="username">
        </div>

        <div class="form-group" style="margin-bottom:var(--space-6);">
          <label class="form-label" for="password">
            <i data-lucide="lock" style="width:13px;height:13px;display:inline;vertical-align:middle;margin-right:4px;"></i>
            Password
          </label>
          <div class="pw-wrapper">
            <input type="password" id="password" class="form-control" placeholder="Masukkan password" required autocomplete="current-password">
            <button type="button" class="pw-toggle" id="pwToggle" onclick="togglePw()">
              <i data-lucide="eye" style="width:17px;height:17px;" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="btnLogin" class="btn btn-primary btn-full btn-lg">
          <i data-lucide="log-in" style="width:18px;height:18px;"></i>
          Masuk ke Dashboard
        </button>
      </form>
    </div>

    <!-- Footer -->
    <div class="login-footer">
      <a href="../index.html" style="font-size:0.8rem;color:var(--text-muted);display:flex;align-items:center;justify-content:center;gap:6px;">
        <i data-lucide="arrow-left" style="width:13px;height:13px;"></i>
        Kembali ke Halaman Pelanggan
      </a>
    </div>
  </div>

  <script>
    lucide.createIcons();

    // Redirect jika sudah login
    if (localStorage.getItem('admin_token')) {
      window.location.href = 'dashboard.html';
    }

    // Toggle visibilitas password
    let pwVisible = false;
    function togglePw() {
      pwVisible = !pwVisible;
      document.getElementById('password').type = pwVisible ? 'text' : 'password';
      document.getElementById('eyeIcon').setAttribute('data-lucide', pwVisible ? 'eye-off' : 'eye');
      lucide.createIcons();
    }

    // Submit Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      btn.disabled = true;
      btn.innerHTML = '<i data-lucide="loader-circle" style="width:18px;height:18px;"></i> Memverifikasi...';
      lucide.createIcons();

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value.trim()
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.pesan || 'Login gagal.');

        localStorage.setItem('admin_token',    data.token);
        localStorage.setItem('admin_username', data.user.username);
        window.location.href = 'dashboard.html';
      } catch (err) {
        alert(err.message);
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="log-in" style="width:18px;height:18px;"></i> Masuk ke Dashboard';
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
